unit = "percent"
unit_basis = "field-name suffix _pct; values within 0..100"
plausible_min = 0
plausible_max = 100
plausible_basis = "definition of a percentage"
source = "gen:L16,L26,L36"
[fields.packet_loss_pct.observed_ranges]
normal = [0.0, 0.0]
latency_spike = [0.1, 1.5]
