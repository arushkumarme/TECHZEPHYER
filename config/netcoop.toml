# NetCoop AI runtime configuration. Secrets never go here (doc 12 §6).

# Only "simulation" is accepted (doc 02 §5); anything else is refused, never defaulted to live.
mode = "simulation"

[features]
community_signals = false   # Extension A (doc 10)
geospatial = false          # Extension B (doc 11)
llm = false                 # LLM gateway (doc 02 C-LLM); null provider when false

[ingestion]
# Entity is stale when its newest record is older than the bundle reference time by more
# than this. PROPOSAL value: the generator has no sampling interval (doc 06 §4 item 4).
stale_after_s = 900
supported_bundle_majors = [1]
adapter_bundle_majors = [0]   # team-authored flat layout, see ingestion/normalize.py

[orchestration]
# Doc 04 §4-§5. PROPOSAL values; deterministic replay does not depend on them.
specialist_deadline_s = 10.0
agent_retries = 1                 # retry a failed/late agent once, then mark it missing
max_clarification_rounds = 2      # doc 03 §3 initial default
parallel_specialists = true
tool_transport = "direct"         # "mcp": agents read data through the NetCoop MCP server

[orchestration.tool_budgets]
performance_agent = 30
infrastructure_agent = 30
connectivity_agent = 40
