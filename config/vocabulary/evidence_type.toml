# Controlled vocabulary 'evidence_type'. Source of truth for its metadata; the term set
# itself is enforced in code where `code_literal` is given (a test keeps them equal).
name = "evidence_type"
version = "1.0"
extensible = false
id_style = "snake"
description = "What an evidence reference points at (PROVISIONAL, D-19)."

[[terms]]
id = "observation"
label = "Observation"
definition = "A measured or derived fact in a finding."
status = "active"
source = "doc 05 §4"
[terms.attributes]
id_prefix = "OBS-"

[[terms]]
id = "hypothesis"
label = "Hypothesis"
definition = "An agent-local interpretation."
status = "active"
source = "doc 05 §4"
[terms.attributes]
id_prefix = "HYP-"

[[terms]]
id = "normalized_record"
