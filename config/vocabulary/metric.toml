# Controlled vocabulary 'metric'. Source of truth for its metadata; the term set
# itself is enforced in code where `code_literal` is given (a test keeps them equal).
name = "metric"
version = "1.0"
extensible = false
id_style = "snake"
description = "Metric names used in observations: the generator's observed fields plus team-authored probe items. Never invent more (CLAUDE.md rule 1)."

[[terms]]
id = "latency_ms"
label = "Latency"
definition = "Generator field 'latency_ms' (doc 06 §2), category latency, unit millisecond."
status = "active"
source = "OBSERVED doc 06 §2"
[terms.attributes]
origin = "generator"
category = "latency"
unit = "millisecond"
dimension = "time"

