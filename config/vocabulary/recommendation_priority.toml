# Controlled vocabulary 'recommendation_priority'. Source of truth for its metadata; the term set
# itself is enforced in code where `code_literal` is given (a test keeps them equal).
name = "recommendation_priority"
version = "1.0"
extensible = false
id_style = "snake"
description = "Priority of a recommendation (PROVISIONAL, D-19; not used yet)."

[[terms]]
