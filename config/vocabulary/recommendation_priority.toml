definition = "Act first."
status = "active"
source = "PROPOSAL"

[[terms]]
id = "medium"
label = "Medium"
definition = "Act after high-priority items."
status = "active"
source = "PROPOSAL"

[[terms]]
id = "low"
label = "Low"
definition = "Optional."
status = "active"
source = "PROPOSAL"
