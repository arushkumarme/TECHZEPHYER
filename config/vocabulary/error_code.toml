# Controlled vocabulary 'error_code'. Source of truth for its metadata; the term set
# itself is enforced in code where `code_literal` is given (a test keeps them equal).
name = "error_code"
version = "1.0"
extensible = false
id_style = "upper"
description = "Every error, warning and limitation code the system emits. Severity: fatal stops the incident, error degrades it, warning is surfaced, info is logged."

[[terms]]
id = "AGENT_FAILED"
label = "Agent failed"
definition = "An agent reported or suffered a failure."
status = "active"
source = "doc 05 §7; doc 04 §5"
[terms.attributes]
severity = "error"
kind = "orchestration"

[[terms]]
id = "AGENT_MISSING"
label = "Agent missing"
definition = "No finding arrived from an agent; its evidence is absent."
status = "active"
