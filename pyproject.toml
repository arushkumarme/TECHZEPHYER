[project]
name = "netcoop"
version = "0.1.0"
description = "NetCoop AI - multi-agent network fault diagnosis and interoperability (hackathon simulation mode)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9,<3",
    "networkx>=3.3,<4",
]

[project.scripts]
netcoop = "netcoop.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netcoop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: exercises several real components together",
    "e2e: full scenario run through the public interface",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["sample_data/generator"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["netcoop"]
plugins = ["pydantic.mypy"]
